{{ define "main" }}
<section class="flex justify-center items-center min-vh-100 bg-near-white">
  <div class="w-90 w-60-ns bg-white br3 shadow-4 pa4 pa5-ns fade-in">
    
    <!-- Ảnh đại diện -->
    <div class="tc mb4">
      <h1 class="f2 fw6 mt3 mb2">{{ .Title }}</h1>
      {{ with .Params.image }}
        <img src="{{ . | relURL }}" alt="Ảnh cá nhân" 
             class="br-100 h5 w5 shadow-4 grow" 
             style="object-fit: cover; transition: transform 0.3s;">
      {{ end }}
      <p class="gray f5">Sinh viên lớp <strong>22DTHC5</strong> – Ngành <em>Công nghệ Thông tin</em></p>
    </div>

    <!-- Nội dung -->
    <div class="lh-copy f4 measure-wide center mb4">
      {{ .Content }}
    </div>

    <!-- Chứng chỉ -->
    {{ with .Page.Params.certificates }}
      <section class="cert-section mt5">
        <h2 class="f3 fw7 tc mb4">🏅 Chứng chỉ & Thành tích</h2>
        <div class="cert-grid">
          {{ range . }}
            <div class="cert-card glass">
              <img src="{{ .image | relURL }}" alt="{{ .title }}" class="cert-img hover-zoom" data-pdf="{{ .pdf | relURL }}">
              <p class="cert-title">{{ .title }}</p>
              <a href="{{ .pdf | relURL }}" target="_blank" class="btn-cert">📄 Xem chứng chỉ (PDF)</a>
            </div>
          {{ end }}
        </div>
      </section>
    {{ end }}

  </div>
</section>

<!-- Hiệu ứng lightbox zoom + mờ nền -->
<script>
document.querySelectorAll('.cert-img').forEach(img => {
  img.addEventListener('click', () => {
    const lightbox = document.createElement('div');
    lightbox.className = 'cert-lightbox active';
    
    const pdfLink = img.dataset.pdf ? 
      `<a href="${img.dataset.pdf}" target="_blank" class="pdf-btn">📄 Xem PDF</a>` 
      : '';
    
    lightbox.innerHTML = `
      <div class="cert-lightbox-content">
        <img src="${img.src}" alt="">
        ${pdfLink}
      </div>
    `;
    
    document.body.appendChild(lightbox);
    
    // Hiệu ứng zoom + fade-in (Framer Motion style)
    setTimeout(() => lightbox.classList.add('show'), 20);
    
    // Click ngoài ảnh để tắt
    lightbox.addEventListener('click', e => {
      if (e.target === lightbox) {
        lightbox.classList.remove('show');
        setTimeout(() => lightbox.remove(), 300);
      }
    });
  });
});
</script>

<style>
/* Fade-in khi load */
.fade-in {
  opacity: 0;
  animation: fadeIn 0.9s ease-in forwards;
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Lightbox (Framer Motion style) */
.cert-lightbox {
  position: fixed;
  top: 0; left: 0;
  width: 100vw; height: 100vh;
  backdrop-filter: blur(15px);
  background: rgba(0, 0, 0, 0.4);
  display: flex; justify-content: center; align-items: center;
  opacity: 0; transform: scale(0.95);
  transition: opacity 0.35s ease, transform 0.35s ease;
  z-index: 999;
}
.cert-lightbox.show {
  opacity: 1; transform: scale(1);
}
.cert-lightbox-content img {
  max-width: 90%;
  max-height: 80vh;
  border-radius: 12px;
  box-shadow: 0 0 25px rgba(0,255,255,0.5);
  transform: scale(0.9);
  animation: zoomIn 0.4s cubic-bezier(0.22, 1, 0.36, 1) forwards;
}
@keyframes zoomIn {
  from { transform: scale(0.9); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

/* Nút xem PDF */
.btn-cert, .pdf-btn {
  display: inline-block;
  margin-top: 10px;
  padding: 8px 16px;
  background: linear-gradient(90deg, #667eea, #764ba2);
  color: white; text-decoration: none;
  border-radius: 8px;
  font-weight: 600;
  transition: transform 0.2s, box-shadow 0.2s;
  box-shadow: 0 0 8px rgba(118,75,162,0.4);
}
.btn-cert:hover, .pdf-btn:hover {
  transform: scale(1.05);
  box-shadow: 0 0 15px rgba(118,75,162,0.7);
}

/* Bố cục grid */
.cert-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 1.5rem;
  justify-items: center;
}
.cert-card {
  background: rgba(255,255,255,0.05);
  padding: 1rem;
  border-radius: 1rem;
  backdrop-filter: blur(10px);
  text-align: center;
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}
.cert-card:hover {
  transform: translateY(-5px);
  box-shadow: 0 8px 20px rgba(0,0,0,0.25);
}
.cert-img {
  width: 100%;
  border-radius: 0.75rem;
  cursor: pointer;
  transition: transform 0.4s ease, filter 0.4s ease;
}
.cert-img:hover {
  transform: scale(1.05);
  filter: brightness(1.1);
}
.cert-title {
  margin-top: 0.5rem;
  font-weight: 600;
  color: #333;
}

/* Tổng thể */
body {
  background: linear-gradient(135deg, #1e3c72, #2a5298);
  font-family: 'Inter', sans-serif;
}
</style>
{{ end }}
