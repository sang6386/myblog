<header class="site-header glass pa3 pa4-ns flex justify-between items-center fixed w-100 top-0 z-999">
  <!-- Logo / Brand -->
  <a href="{{ .Site.BaseURL }}" class="logo f3 fw7 neon-text">
    {{ .Site.Title }}
  </a>

  <!-- Navigation -->
  <nav class="nav-links flex items-center">
    {{ range .Site.Menus.main }}
      <a href="{{ .URL }}" class="nav-link mh3 pv2 px3 rounded neon-btn">{{ .Name }}</a>
    {{ end }}
  </nav>

  <!-- Dark/Light toggle moved here for header -->
  <button id="theme-toggle-header" class="theme-toggle-header ml3" aria-label="Chuyển chế độ sáng/tối">🌙 / ☀️</button>
</header>

<style>
/* Glassmorphism + neon glow */
.site-header {
  background: rgba(0,0,0,0.5);
  backdrop-filter: blur(12px);
  border-radius: 1rem;
  box-shadow: 0 0 20px rgba(0,255,255,0.3);
}

/* Neon text */
.neon-text {
  color: #0ff;
  text-shadow: 0 0 5px #0ff, 0 0 10px #764ba2, 0 0 20px #00ffff;
}

/* Nav links */
.nav-link {
  color: #0ff;
  text-decoration: none;
  font-weight: 600;
  text-shadow: 0 0 5px #0ff, 0 0 10px #00ffff;
  transition: all 0.3s ease;
}
.nav-link:hover {
  transform: scale(1.05);
  text-shadow: 0 0 15px #0ff, 0 0 25px #00ffff;
  box-shadow: 0 0 10px #00ffff;
  border-radius: 0.5rem;
  padding: 0.5rem 0.75rem;
}

/* Responsive menu */
@media (max-width: 768px) {
  .nav-links {
    display: none; /* Simplified: hide nav on mobile, could add hamburger menu */
  }
}

/* Header Dark/Light button */
.theme-toggle-header {
  background: linear-gradient(90deg, #00ffff, #764ba2);
  color: #fff;
  padding: 0.5rem 1rem;
  border-radius: 1rem;
  border: none;
  cursor: pointer;
  text-shadow: 0 0 5px #fff;
  box-shadow: 0 0 10px #00ffff;
  transition: all 0.3s ease;
}
.theme-toggle-header:hover {
  transform: scale(1.05);
  box-shadow: 0 0 20px #00aaff,0 0 30px #00ffff;
}
</style>
